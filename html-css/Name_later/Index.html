<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Button-Popup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        .notification-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
        }

        .custom-alert {
            width: 400px;
            margin-top: 10px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
        }

        .custom-alert.show {
            opacity: 1;
        }

        .custom-alert.hide {
            opacity: 0;
        }

        .btn-container {
            margin-top: 250px;
            /* So it's not overlapping the toasts */
        }
    </style>
</head>

<body>
    <section>
        <article>
            <div class="text-center btn-container">
                <button class="btn btn-danger" onclick="showAlert()">My Button</button>
            </div>

            <!-- Notification stacking area at bottom -->
            <div id="notificationContainer" class="notification-container"></div>
        </article>
    </section>

    <script>
        function showAlert() {
            const container = document.getElementById("notificationContainer");

            // Create alert element
            const alert = document.createElement("div");
            alert.className = "alert alert-success custom-alert";
            alert.innerHTML = "<strong>Success!</strong> Indicates a successful or positive action.";

            // Add to DOM
            container.appendChild(alert);

            // Trigger fade-in
            setTimeout(() => {
                alert.classList.add("show");
            }, 10);

            // Fade out after 3.5s, then remove from DOM after 0.4s
            setTimeout(() => {
                alert.classList.remove("show");
                alert.classList.add("hide");
                setTimeout(() => alert.remove(), 400);
            }, 3500);
        }
    </script>
</body>

</html>
