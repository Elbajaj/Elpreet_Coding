<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Example</title>

    <link href="bootstrap.min.css" rel="stylesheet" />
    <script src="bootstrap.min.js"></script>

</head>

<body>
    <div class="container">
        <h1 class="text-primary">Primary Heading</h1>
        <p class="text-success">This is green text.</p>
        <p class="fw-bold">Bold text using a utility class.</p>
        <p class="text-center">This text is centered.</p>

        <button class="btn btn-primary">Primary Button</button>
        <a href="#" class="btn btn-danger">Danger Link</a>
        <button class="btn btn-outline-secondary">Outline Button</button>

        <div class="row">
            <div class="col-md-6">
                <h2>Left Column</h2>
                <p>This column takes half the width on medium screens and larger.</p>
            </div>
            <div class="col-md-6">
                <h2>Right Column</h2>
                <p>This is the second column.</p>
            </div>
        </div>
    </div>

    <form>
        <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" placeholder="name@example.com" />
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" placeholder="Enter your password" />
        </div>
        <button type="submit" class="btn btn-success">Submit</button>
    </form>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>#</th>
                <th>Name</th>
                <th>Age</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>John</td>
                <td>25</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Jane</td>
                <td>30</td>
            </tr>
        </tbody>
    </table>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-zvPIIlnwTjHti6jF5t4LUG+dfcmEFquAC0ET28iZh8dJwG5McwZ/NfOqP98Lvqgk"
        crossorigin="anonymous"></script>
</body>

</html>
